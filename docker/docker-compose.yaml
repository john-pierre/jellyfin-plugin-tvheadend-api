services:
  jellyfin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jellyfin-tvheadend-dev
    user: "0:0"
    privileged: true
    environment:
      - TZ=Europe/Berlin
    ports:
      - "8096:8096"   # Jellyfin HTTP
      - "8920:8920"   # Jellyfin HTTPS
    volumes:
      # Persist the entire Jellyfin data directory (users, plugins, plugin config, DB)
      - ./.docker/config:/config
      - ./.docker/cache:/cache
      - ./.docker/media:/media
    restart: unless-stopped
