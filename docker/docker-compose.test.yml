# Live integration test environment: Jellyfin + TVHeadend + IPTV simulator.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   # Wait ~15s for services to start, then run live integration tests:
#   TVHEADEND_LIVE_TESTS=true dotnet test ... --filter "Category=LiveIntegration"
#   docker compose -f docker-compose.test.yml down
#
# TVHeadend is pre-configured with no password (-C flag) for test simplicity.
# This stack is NOT for production — it runs with relaxed security settings.

services:
  iptv-sim:
    build:
      context: ./iptv-sim
      dockerfile: Dockerfile
    container_name: iptv-sim
    ports:
      - "18888:80"
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://iptv-sim:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  tvheadend:
    # Pinned to a specific build for reproducible CI. Update periodically.
    image: linuxserver/tvheadend:37453bc3-ls279
    container_name: tvh-integration-test
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # Skip first-run wizard so the API is available immediately without auth.
      # linuxserver/tvheadend passes RUN_OPTS to the tvheadend binary.
      - RUN_OPTS=-C
    ports:
      - "19981:9981"    # TVHeadend HTTP API (offset to avoid conflicts with dev stack)
      - "19982:9982"    # TVHeadend HTSP (not used by plugin, but useful for debugging)
    volumes:
      - tvh-test-config:/config
      - tvh-test-recordings:/recordings
    depends_on:
      iptv-sim:
        condition: service_healthy
    restart: "no"
    healthcheck:
      # linuxserver/tvheadend is Alpine-based (busybox wget, no curl).
      # Healthcheck runs INSIDE the container, so localhost is correct.
      # /api/status/inputs returns JSON without auth when -C flag is set.
      test: ["CMD-SHELL", "wget --spider -q --timeout=5 http://tvh-integration-test:9981/api/status/inputs || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s

  jellyfin:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: jf-integration-test
    environment:
      - TZ=Europe/Berlin
    ports:
      - "18096:8096"    # Jellyfin HTTP (offset to avoid conflicts with dev stack)
    volumes:
      - jf-test-config:/config
      - jf-test-cache:/cache
    depends_on:
      tvh-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  tvh-bootstrap:
    image: alpine:3.20
    container_name: tvh-bootstrap
    volumes:
      - ./tvh-bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      - TVH_URL=http://tvheadend:9981
      - IPTV_SIM_URL=http://iptv-sim
      - MAX_WAIT=60
    depends_on:
      tvheadend:
        condition: service_healthy
    restart: "no"

volumes:
  tvh-test-config:
  tvh-test-recordings:
  jf-test-config:
  jf-test-cache:

