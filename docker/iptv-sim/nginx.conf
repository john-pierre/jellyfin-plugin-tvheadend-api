worker_processes 1;
events { worker_connections 128; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # M3U playlist
        location /playlist.m3u {
            alias /srv/playlist.m3u;
            add_header Content-Type "audio/x-mpegurl";
        }

        # XMLTV EPG
        location /epg.xml {
            alias /srv/epg.xml;
            add_header Content-Type "application/xml";
        }

        # MPEG-TS streams (looped via nginx slice module isn't needed;
        # TVHeadend only fetches once for IPTV file:// or http:// muxes)
        location /stream/ {
            alias /srv/stream/;
            add_header Content-Type "video/mp2t";
        }

        # Logos (simple 1x1 PNG placeholder)
        location ~ ^/logo[0-9]+\.png$ {
            alias /srv/logo.png;
            add_header Content-Type "image/png";
        }

        # Health check
        location /health {
            return 200 "OK";
            add_header Content-Type "text/plain";
        }
    }
}

