services:
  jellyfin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-tvheadend-dev
    environment:
      - TZ=Europe/Berlin
    ports:
      - "8096:8096"   # Jellyfin HTTP
      - "8920:8920"   # Jellyfin HTTPS
    volumes:
      # Persistent Jellyfin data – survives rebuilds
      - ./.docker/config:/config/config
      - ./.docker/data:/config/data
      - ./.docker/metadata:/config/metadata
      - ./.docker/cache:/cache
      - ./.docker/media:/media
    restart: unless-stopped
