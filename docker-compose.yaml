services:
  jellyfin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-tvheadend-dev
    environment:
      - TZ=Europe/Berlin
      # Verbose troubleshooting defaults for development
      - JELLYFIN_Logging__LogLevel__Default=Debug
    ports:
      - "8096:8096"   # Jellyfin HTTP
      - "8920:8920"   # Jellyfin HTTPS
    volumes:
      # Persist the entire Jellyfin data directory (users, plugins, plugin config, DB)
      - ./.docker/config:/config
      - ./.docker/cache:/cache
      - ./.docker/media:/media
    restart: unless-stopped
