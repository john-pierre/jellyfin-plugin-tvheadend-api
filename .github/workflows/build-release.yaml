# GitHub Actions Workflow: Combined CI/CD and PR Validation Pipeline
#
# Description:
# This workflow combines build validation and release packaging for the Jellyfin plugin.
# It runs on pull requests for build/test/package validation and on pushes to main for release automation.
#
# Key Features:
# - Uses Release Please to manage versioning and changelogs.
# - Builds the plugin, runs tests, and packages the artifacts.
# - Uploads artifacts for pull requests and creates releases for main branch pushes.
# - Provides immediate feedback to contributors about build/test results.
#
# Use Cases:
# - CI/CD for Jellyfin plugin development, combining validation and deployment processes.
# - Enforcing high-quality standards for commit history and release management.
# - Ensuring reliable, automated builds and releases with minimal manual intervention.

name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release Please
        id: release-please
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.release-please.outputs.release_created }}" = "true" ]; then
            VERSION_WITHOUT_V="${{ steps.release-please.outputs.tag_name }}"
            VERSION_WITHOUT_V="${VERSION_WITHOUT_V#v}"
            echo "version=${VERSION_WITHOUT_V}.0" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Dependencies
        run: dotnet restore Jellyfin.Plugin.TvHeadendApi.sln

      - name: Build Plugin
        run: >
          dotnet build Jellyfin.Plugin.TvHeadendApi.sln
          --configuration Release
          --no-restore
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Run Unit Tests
        run: >
          dotnet test Jellyfin.Plugin.TvHeadendApi.Tests/Jellyfin.Plugin.TvHeadendApi.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/'
          if-no-files-found: ignore


      - name: Create Package
        if: ${{ github.event_name == 'pull_request' || steps.release-please.outputs.release_created == 'true' }}
        id: create_package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_DIR="tvheadend_api_${VERSION}"
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          mkdir -p "$PACKAGE_DIR"
          find Jellyfin.Plugin.TvHeadendApi/bin/Release/net8.0 -maxdepth 1 -type f \( -name '*.dll' -o -name '*.pdb' -o -name '*.xml' \) -exec cp {} "$PACKAGE_DIR"/ \;

          jq --arg timestamp "$TIMESTAMP" \
             --arg targetAbi "10.10.3.0" \
             --arg version "$VERSION" \
             '.[0] | del(.versions) | . + {targetAbi: $targetAbi, timestamp: $timestamp, version: $version}' manifest.json > "$PACKAGE_DIR/meta.json"

          zip -r "${PACKAGE_DIR}.zip" "$PACKAGE_DIR"

      - name: Calculate Checksums
        if: ${{ github.event_name == 'pull_request' || steps.release-please.outputs.release_created == 'true' }}
        id: calculate_checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          md5sum "tvheadend_api_${VERSION}.zip" > "tvheadend_api_${VERSION}.md5"
          sha256sum "tvheadend_api_${VERSION}.zip" > "tvheadend_api_${VERSION}.sha256"
          CHECKSUM_MD5=$(awk '{print $1}' "tvheadend_api_${VERSION}.md5")
          CHECKSUM_SHA256=$(awk '{print $1}' "tvheadend_api_${VERSION}.sha256")
          echo "artifact_md5=${CHECKSUM_MD5}" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=${CHECKSUM_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload PR Artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: tvheadend_api_${{ steps.version.outputs.version }}
          path: |
            tvheadend_api_${{ steps.version.outputs.version }}.zip
            tvheadend_api_${{ steps.version.outputs.version }}.md5
            tvheadend_api_${{ steps.version.outputs.version }}.sha256

      - name: Upload Release Assets
        if: ${{ steps.release-please.outputs.release_created == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-please.outputs.tag_name }}
          files: |
            tvheadend_api_${{ steps.version.outputs.version }}.zip
            tvheadend_api_${{ steps.version.outputs.version }}.md5
            tvheadend_api_${{ steps.version.outputs.version }}.sha256

      - name: Update manifest.json
        if: ${{ steps.release-please.outputs.release_created == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          CHANGELOG="https://github.com/john-pierre/jellyfin-plugin-tvheadend-api/releases/tag/${{ steps.release-please.outputs.tag_name }}"
          SOURCE_URL="https://github.com/john-pierre/jellyfin-plugin-tvheadend-api/releases/download/${{ steps.release-please.outputs.tag_name }}/tvheadend_api_${{ steps.version.outputs.version }}.zip"
          TARGET_ABI="10.10.3.0"
          REPOSITORY_NAME="jellyfin-plugin-tvheadend-api"
          REPOSITORY_URL="https://github.com/john-pierre/jellyfin-plugin-tvheadend-api"

          jq --arg version "${{ steps.version.outputs.version }}" \
             --arg checksum "${{ steps.calculate_checksums.outputs.artifact_md5 }}" \
             --arg changelog "$CHANGELOG" \
             --arg timestamp "$TIMESTAMP" \
             --arg source_url "$SOURCE_URL" \
             --arg target_abi "$TARGET_ABI" \
             --arg repository_name "$REPOSITORY_NAME" \
             --arg repository_url "$REPOSITORY_URL" \
             '.[0].versions |= ([{
                version: $version,
                changelog: $changelog,
                targetAbi: $target_abi,
                sourceUrl: $source_url,
                checksum: $checksum,
                timestamp: $timestamp,
                repositoryName: $repository_name,
                repositoryUrl: $repository_url
              }] + . | unique_by(.version) | sort_by(.version | split(".") | map(tonumber)) | reverse)' manifest.json > updated_manifest.json

          mv updated_manifest.json manifest.json

      - name: Commit manifest.json
        if: ${{ steps.release-please.outputs.release_created == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "build(release): update manifest for ${{ steps.release-please.outputs.tag_name }} [skip ci]"
          file_pattern: manifest.json
